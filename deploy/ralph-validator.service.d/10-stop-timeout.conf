[Service]
# systemd's STOP timeout is NOT covered by TimeoutStartSec. Without this the unit inherits
# DefaultTimeoutStopUSec=90s, so `systemctl stop ralph-validator` — the obvious human response now
# that SIGTERM raises and tears down — would SIGTERM the round and then SIGKILL it 90 seconds later,
# mid-teardown, because destroy() retries three times with a 60s POST and a 60s GET each. The stop
# that exists to end a leak would cause one.
#
# A DROP-IN, NEVER A UNIT REWRITE: the node's ralph-validator.service is not in this repo and has
# already drifted from its own comments, so shipping a hand-reconstructed copy risks silently
# dropping --live or -u.
TimeoutStopSec=900
